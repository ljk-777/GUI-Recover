name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -m 'not integration'
      - run: bash scripts/setup_miniwob.sh
      - if: matrix.os == 'ubuntu-22.04'
        run: python -m playwright install --with-deps chromium
      - if: matrix.os == 'ubuntu-24.04'
        run: GUI_RECOVER_PYTHON=python bash scripts/setup_browser_ubuntu24.sh
      - run: |
          export MINIWOB_URL="file://$GITHUB_WORKSPACE/vendor/miniwob-plusplus/miniwob/html/miniwob/"
          python -m pytest -m integration
  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install dist/*.whl
      - run: |
          gui-recover --version
          gui-recover text-recovery --help
          gui-recover audit-text-recovery --help
          gui-recover active-text-recovery --help
          gui-recover audit-active-text-recovery --help
          gui-recover demo-tail-probe --help
